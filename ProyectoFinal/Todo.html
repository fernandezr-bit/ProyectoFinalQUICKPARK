<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Tareas</title>

<style>
    body{
        font-family: Arial;
        background:#bce7fb;
        display:flex;
        justify-content:center;
        margin-top:50px;
    }

    .contenedor{
        background:#f8f4a8;
        padding:20px;
        width:400px;
        border-radius:10px;
    }

    .entrada{
        display:flex;
        gap:10px;
    }

    input, button{
        padding:10px;
        border-radius:5px;
        border:none;
    }

    input{
        flex:1;
    }

    button{
        cursor:pointer;
        color:white;
    }

    #agregar{
        background:#89f48d;
    }

    .tarea{
        display:flex;
        justify-content:space-between;
        align-items:center;
        background:#a6eeee;
        padding:10px;
        margin-top:10px;
        border-radius:5px;
    }

    .completada{
        text-decoration:line-through;
        color:gray;
    }

    .completar{
        background:#007bff;
    }

    .eliminar{
        background:#dc3545;
    }
</style>
</head>

<body>

<div class="contenedor">

    <h1>Lista de Tareas</h1>

    <div class="entrada">
        <input type="text" id="texto" placeholder="Escribe una tarea">
        <button id="agregar">Agregar</button>
    </div>

    <ul id="lista"></ul>

</div>

<script>

const texto = document.getElementById("texto");
const lista = document.getElementById("lista");

document.getElementById("agregar").onclick = agregarTarea;

texto.addEventListener("keypress", e => {
    if(e.key === "Enter") agregarTarea();
});

function agregarTarea(){

    if(texto.value.trim() === ""){
        alert("Escribe una tarea");
        return;
    }

    const tarea = document.createElement("li");

    tarea.className = "tarea";

    tarea.innerHTML = `
        <span>${texto.value}</span>

        <div>
            <button class="completar">Completado</button>
            <button class="eliminar">Borrar</button>
        </div>
    `;

    tarea.querySelector(".completar").onclick = () =>
        tarea.querySelector("span").classList.toggle("completada");

    tarea.querySelector(".eliminar").onclick = () =>
        tarea.remove();

    lista.appendChild(tarea);

    texto.value = "";
}

</script>

</body>
</html>
