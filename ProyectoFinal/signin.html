    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- Agrega el enlace a Bootstrap para estilos adicionales (aprendido en clase) -->
        <link rel="stylesheet" href="signinStyle.css"> <!-- Relaciona el html con el archivo CSS para los estilos -->
    </head>

    <body>
        <div class="tarjeta">
            <div class="w-100"> <!-- w-100: ancho del 100% para ocupar todo el espacio de la tarjeta -->
                <div class="row align-items-center h-100">
                    <!-- h-100: altura del 100% para ocupar toda la altura de la tarjeta -->
                    <div class="col-12 col-md-6 col-lg-6">
                        <h1 class="asterisco">*</h1>
                        <h1 class="bienvenida">¡Sumate a la experiencia!</h1>
                        <h3 class="texto">Completá tus datos para crear tu cuenta y empezar ahora.</h3>
                        <form action="login.php" method="post">
                            <div class="input-group mb-3">
                                <span class="input-group-text">Matrícula del vehículo</span>
                                <input type="text" aria-label="matricula" class="form-control" placeholder="Ej.: ABC1234" name="matricula">
                                <span class="input-group-text">Cédula:</span>
                                <input type="text" aria-label="cedula" class="form-control" placeholder="Ej.: 12345678" name="cedula">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text" id="basic-addon1">Usuario:</span>
                                <input type="text" class="form-control" placeholder="Escriba su usuario"
                                    aria-label="Username" aria-describedby="basic-addon1" name="usuario">
                            </div>
                            <div class="input-group mb-3">
                                <input type="text" class="form-control" placeholder="Escriba su Gmail"
                                    aria-label="Recipient’s username" aria-describedby="basic-addon2" name="dominio">
                                <span class="input-group-text" id="basic-addon2">@gmail.com</span>
                            </div>
                            <div class="input-group mb-3">
                                <label for="password" class="input-group-text">Contraseña:</label>
                                <input type="password" class="form-control" placeholder="Contraseña"
                                    aria-label="Recipient's username" aria-describedby="button-addon2" name="password">
                                <button class="btn btn-outline-secondary" type="button"
                                    onclick="this.previousElementSibling.type = this.previousElementSibling.type === 'password' ? 'text' : 'password'">
                                    🔍
                                </button>
                            </div>
                            <h4 class="recuerda-texto">* Recuerda: Nunca compartiremos tu información personal.</h4>
                            <button type="submit" class="btnEnviar">Enviar</button>
                        </form>
                        <h4 class="login-texto"> ¿Ya tienes una cuenta? ¡Inicia sesión <a href="login.html"> aquí</a>!</h4>
                    </div>
                    <div class="col-12 col-md-6 col-lg-6 mb-4 mb-md-0">
                        <!-- las columnas se ajustan según el tamaño de la pantalla, pantalla grande tiene un tamaño de 6, pantalla mediana tiene un tamaño de 6 y pantalla pequeña tiene un tamaño de 12 -->
                        <img src="fondologin.png" class="img-fluid d-block" alt="imagen">
                        <!-- img-fluid: hace que la imagen sea responsive, d-block: hace que la imagen se muestre como un bloque para evitar espacios debajo de la imagen -->
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <!-- Agrega el enlace a Bootstrap para funcionalidades adicionales (aprendido en clase) -->
    </body>

    </html>

</body>

</html>
